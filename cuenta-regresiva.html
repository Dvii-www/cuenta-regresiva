    background-position:center;
    filter:blur(22px) brightness(0.5) saturate(0.85);

    z-index:0;

  .fondo-tinte{
    position:fixed;
    inset:0;
background:radial-gradient(ellipse at bottom, rgba(74,122,148,0.38) 0%, rgba(30,48,58,0.55) 60%, rgba(12,19,23,0.72) 100%);    z-index:1;
  }
  .escena{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  /* ---------- ascuas flotando (ambiente de fogata) ---------- */
  .ascuas{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:3;
  }
  .ascua{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:var(--fogata);
    opacity:0;
    animation-name: flotar;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    box-shadow:0 0 6px 1px rgba(201,122,43,0.7);
  }
  @keyframes flotar{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.9; }
    100%{ transform:translateY(-100vh) translateX(var(--deriva)); opacity:0; }
  }

  .contenido{position:relative; z-index:1; max-width:900px;}

  .titulo{
    font-size:clamp(1.4rem, 3.2vw, 2.2rem);
    color:var(--papel);
    margin-bottom:8px;
    font-weight:400;
  }
  .subtitulo{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:0.9rem;
    color:#B7C9D6;
    margin-bottom:44px;
  }

  .bloques{
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:36px;
  }
  .bloque{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:20px 14px;
    min-width:100px;
  }
  .numero{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:clamp(2.4rem, 7vw, 4rem);
    font-weight:700;
    color:var(--dorado);
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .etiqueta{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:0.72rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#B7C9D6;
    margin-top:8px;
  }

  .fecha-legible{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:0.95rem;
    color:#D9E6EC;
  }

  /* ---------- celebración al llegar a cero ---------- */
  .celebracion{
    display:none;
    position:relative;
    z-index:1;
  }
  .celebracion.visible{display:block;}
  .bloques-normal.oculto{display:none;}
  .celebracion h1{
    font-size:clamp(2.2rem, 6vw, 4rem);
    color:var(--dorado);
    margin-bottom:10px;
  }
  .confeti-capa{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5;
  }
  .confeti{
    position:absolute; top:-20px; width:9px; height:14px; opacity:0.95;
    animation-name: caerConfeti; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  @keyframes caerConfeti{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) translateX(var(--derivaConfeti)) rotate(var(--vueltas)); opacity:0.9; }
  }

  /* ---------- panel de configuración (solo organizador) ---------- */
  .btn-config{
    position:fixed; top:16px; right:18px;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:var(--papel);
    font-size:1.1rem;
    border:none;
    cursor:pointer;
    z-index:20;
  }
  .btn-config:hover{background:rgba(255,255,255,0.18);}
  .panel-config{
    display:none;
    position:fixed;
    top:60px; right:16px;
    width:280px;
    background:var(--papel);
    color:#232323;
    border-radius:8px;
    padding:18px;
    z-index:25;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
    font-family:-apple-system, Helvetica, Arial, sans-serif;
  }
  .panel-config.visible{display:block;}
  .panel-config label{
    display:block; font-size:0.75rem; color:#555; margin:10px 0 4px;
  }
  .panel-config input{
    width:100%; padding:8px 9px; border:1px solid #DAD2BE;
    background:#FCFAF4; font-size:0.88rem; font-family:inherit;
  }
  .panel-config button{
    margin-top:14px; width:100%; padding:9px; border:none;
    background:var(--fogata); color:white; font-size:0.85rem; border-radius:4px; cursor:pointer;
  }
  .panel-config button:hover{background:#a8631e;}
  .estado-config{font-size:0.75rem; color:#5A7D4A; margin-top:8px; min-height:14px; word-break:break-all;}

  /* ---------- ajustes para pantallas angostas (celular) ---------- */
  @media (max-width: 480px){
    .bloques{ gap:10px; }
    .bloque{ min-width:72px; padding:14px 8px; }
    .subtitulo{ margin-bottom:30px; }
    .panel-config{
      right:8px; left:8px; width:auto; top:58px;
    }
    .btn-config{ top:12px; right:12px; }
  }
</style>
</head>
<body>

<div class="fondo-logo"></div>
<div class="fondo-tinte"></div>
<div class="ascuas" id="ascuas"></div>

<button class="btn-config" id="btn-config" title="Configurar">⚙</button>
<div class="panel-config" id="panel-config">
  <label>Título</label>
  <input type="text" id="config-titulo" placeholder="¡Nos vemos en el campamento!">
  <label>Fecha y hora de inicio</label>
  <input type="datetime-local" id="config-fecha">
  <button id="btn-guardar-config">Guardar y generar enlace</button>
  <div class="estado-config" id="estado-config"></div>
</div>

<div class="escena">
  <div class="contenido">

    <div class="bloques-normal" id="vista-normal">
      <div class="titulo" id="texto-titulo">¡Nos vemos en el campamento!</div>
      <div class="subtitulo" id="texto-fecha-legible"></div>
      <div class="bloques">
        <div class="bloque"><div class="numero" id="num-dias">00</div><div class="etiqueta">Días</div></div>
        <div class="bloque"><div class="numero" id="num-horas">00</div><div class="etiqueta">Horas</div></div>
        <div class="bloque"><div class="numero" id="num-min">00</div><div class="etiqueta">Min</div></div>
        <div class="bloque"><div class="numero" id="num-seg">00</div><div class="etiqueta">Seg</div></div>
      </div>
    </div>

    <div class="celebracion" id="vista-celebracion">
      <h1>🎉 ¡Ya comenzó! 🎉</h1>
      <div class="fecha-legible">Nos vemos en el campamento</div>
    </div>

  </div>
</div>

<div class="confeti-capa" id="confeti-capa"></div>

<script>
/* ---------- configuración: por URL (?fecha=&titulo=) o valores por defecto ---------- */
const params = new URLSearchParams(window.location.search);

function fechaPorDefecto(){
  const d = new Date();
  d.setDate(d.getDate() + 30); // dentro de 30 días si no se ha configurado nada
  d.setHours(9,0,0,0);
  return d;
}

let fechaObjetivo = params.get('fecha') ? new Date(params.get('fecha')) : fechaPorDefecto();
let tituloActual = params.get('titulo') ? decodeURIComponent(params.get('titulo')) : '¡Nos vemos en el campamento!';
if(isNaN(fechaObjetivo.getTime())) fechaObjetivo = fechaPorDefecto();

document.getElementById('texto-titulo').textContent = tituloActual;

function formatearFechaLegible(fecha){
  const opciones = { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit' };
  return fecha.toLocaleDateString('es-MX', opciones);
}
document.getElementById('texto-fecha-legible').textContent = 'Comienza el ' + formatearFechaLegible(fechaObjetivo);

/* ---------- ascuas de fondo ---------- */
function crearAscuas(){
  const cont = document.getElementById('ascuas');
  const cantidad = 26;
  for(let i=0;i<cantidad;i++){
    const a = document.createElement('div');
    a.className = 'ascua';
    const tam = 3 + Math.random()*5;
    a.style.width = tam+'px';
    a.style.height = tam+'px';
    a.style.left = Math.random()*100 + 'vw';
    a.style.setProperty('--deriva', (Math.random()*80-40)+'px');
    a.style.animationDuration = (7 + Math.random()*8) + 's';
    a.style.animationDelay = (Math.random()*10) + 's';
    cont.appendChild(a);
  }
}
crearAscuas();

/* ---------- cronómetro regresivo ---------- */
let yaCelebrado = false;

function actualizarCuenta(){
  const ahora = new Date();
  let diff = fechaObjetivo.getTime() - ahora.getTime();

  if(diff <= 0){
    if(!yaCelebrado){
      yaCelebrado = true;
      document.getElementById('vista-normal').classList.add('oculto');
      document.getElementById('vista-celebracion').classList.add('visible');
      lanzarConfeti();
    }
    return;
  }

  const dias = Math.floor(diff / (1000*60*60*24));
  diff -= dias * (1000*60*60*24);
  const horas = Math.floor(diff / (1000*60*60));
  diff -= horas * (1000*60*60);
  const minutos = Math.floor(diff / (1000*60));
  diff -= minutos * (1000*60);
  const segundos = Math.floor(diff / 1000);

  document.getElementById('num-dias').textContent = String(dias).padStart(2,'0');
  document.getElementById('num-horas').textContent = String(horas).padStart(2,'0');
  document.getElementById('num-min').textContent = String(minutos).padStart(2,'0');
  document.getElementById('num-seg').textContent = String(segundos).padStart(2,'0');
}
actualizarCuenta();
setInterval(actualizarCuenta, 1000);

/* ---------- confeti al llegar a cero ---------- */
function lanzarConfeti(){
  const colores = ['#C97A2B','#D4A94A','#7C9473','#F6F1E7'];
  const capa = document.getElementById('confeti-capa');
  for(let i=0;i<90;i++){
    const pieza = document.createElement('div');
    pieza.className = 'confeti';
    pieza.style.left = (Math.random()*100)+'vw';
    pieza.style.background = colores[Math.floor(Math.random()*colores.length)];
    const duracion = 2.5 + Math.random()*2;
    pieza.style.animationDuration = duracion+'s';
    pieza.style.animationDelay = (Math.random()*0.6)+'s';
    pieza.style.setProperty('--derivaConfeti', (Math.random()*160-80)+'px');
    pieza.style.setProperty('--vueltas', (Math.random()*720-360)+'deg');
    if(Math.random()>0.5) pieza.style.borderRadius = '50%';
    capa.appendChild(pieza);
    setTimeout(()=>pieza.remove(), (duracion+1)*1000);
  }
}

/* ---------- panel de configuración (para generar el enlace a compartir) ---------- */
function aIsoLocal(fecha){
  const pad = n => String(n).padStart(2,'0');
  return `${fecha.getFullYear()}-${pad(fecha.getMonth()+1)}-${pad(fecha.getDate())}T${pad(fecha.getHours())}:${pad(fecha.getMinutes())}`;
}

document.getElementById('config-titulo').value = tituloActual;
document.getElementById('config-fecha').value = aIsoLocal(fechaObjetivo);

document.getElementById('btn-config').addEventListener('click', ()=>{
  document.getElementById('panel-config').classList.toggle('visible');
});

document.getElementById('btn-guardar-config').addEventListener('click', async ()=>{
  const nuevoTitulo = document.getElementById('config-titulo').value.trim() || '¡Nos vemos en el campamento!';
  const nuevaFechaTexto = document.getElementById('config-fecha').value;
  if(!nuevaFechaTexto){ alert('Elige una fecha y hora.'); return; }

  const url = new URL(window.location.href);
  url.searchParams.set('fecha', nuevaFechaTexto);
  url.searchParams.set('titulo', encodeURIComponent(nuevoTitulo));
  const enlaceFinal = url.toString();

  const estado = document.getElementById('estado-config');
  try{
    await navigator.clipboard.writeText(enlaceFinal);
    estado.textContent = 'Enlace copiado ✓ Pégalo para compartirlo';
  }catch(e){
    estado.textContent = enlaceFinal;
  }

  // aplica los cambios de una vez en esta misma pantalla
  window.location.href = enlaceFinal;
});
</script>
